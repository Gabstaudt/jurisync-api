services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jurisync
      POSTGRES_PASSWORD: jurisync
      POSTGRES_DB: jurisync
    ports:
      - "5433:5432"
    volumes:
      - jurisync_db_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jurisync -d jurisync"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://jurisync:jurisync@db:5432/jurisync
      DATABASE_SSL: disable
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  jurisync_db_data:
